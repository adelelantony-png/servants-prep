<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل المذكرات والشيتات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .container-box { max-width: 650px; margin: 25px auto; padding: 0 15px; }
        .subject-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
        }
        .subject-card:hover { transform: translateY(-2px); border-color: #cbd5e1; }
    </style>
</head>
<body>

<div class="container-box">
    <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-4 shadow-sm">
        <div>
            <h5 class="fw-bold mb-0 text-primary"><i class="fa-solid fa-file-arrow-down me-2"></i>شيتات ومذكرات الفرقة</h5>
            <small class="text-muted" id="userLevelDisplay">الفرقة الدراسية</small>
        </div>
        <a href="index.html" class="btn btn-outline-secondary btn-sm fw-bold">
            <i class="fa-solid fa-arrow-left me-1"></i> رجوع
        </a>
    </div>

    <div id="sheetsContainer">
        <div class="text-center py-5 text-muted" id="loadingState">
            <i class="fa-solid fa-spinner fa-spin fa-2x mb-3 text-primary"></i>
            <p>جاري جلب الملفات المتاحة لفرقتك...</p>
        </div>
    </div>
</div>

<script src="auth-client.js"></script>
<script>
    const studentLevel = localStorage.getItem('student_level') || 'الفرقة الأولى';
    document.getElementById('userLevelDisplay').textContent = studentLevel;

    // دالة تحويل أي رابط Google Drive عادي إلى رابط تنزيل مباشر
    function convertToDirectDownload(driveUrl) {
        if (!driveUrl) return '#';
        const match = driveUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || driveUrl.match(/id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
            return `https://drive.google.com/uc?export=download&id=${match[1]}`;
        }
        return driveUrl; // إذا كان رابطاً مباشراً لملف خارجي
    }

    async function loadSubjects() {
        const container = document.getElementById('sheetsContainer');
        try {
            const res = await ChurchAuth.fetch(`/api/get_subjects?level=${encodeURIComponent(studentLevel)}`);
            const data = await res.json();

            if (!data.success || !data.subjects || data.subjects.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5 bg-white rounded-4 border">
                        <i class="fa-regular fa-folder-open fa-3x text-muted mb-2"></i>
                        <p class="text-muted fw-bold">لا توجد مذكرات أو شيتات منشورة لهذه الفرقة حالياً.</p>
                    </div>`;
                return;
            }

            // حفظ نسخة محلية للأوفلاين
            localStorage.setItem(`cached_subjects_${studentLevel}`, JSON.stringify(data.subjects));
            renderCards(data.subjects);
        } catch (error) {
            // استرجاع الكاش المحلي في حال انقطاع الإنترنت
            const cached = localStorage.getItem(`cached_subjects_${studentLevel}`);
            if (cached) {
                renderCards(JSON.parse(cached));
            } else {
                container.innerHTML = `<div class="alert alert-warning text-center">تعذر جلب الشيتات لعدم توفر اتصال بالإنترنت.</div>`;
            }
        }
    }

    function renderCards(subjects) {
        const container = document.getElementById('sheetsContainer');
        container.innerHTML = '';
        subjects.forEach(sub => {
            const downloadLink = convertToDirectDownload(sub.sheet_url || sub.attachment_file);
            const card = document.createElement('div');
            card.className = 'subject-card';
            card.innerHTML = `
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="fw-bold mb-1 text-dark">${ChurchAuth.esc(sub.title)}</h6>
                        <small class="text-muted"><i class="fa-regular fa-calendar-check me-1"></i>مقرر دراسي</small>
                    </div>
                    <a href="${ChurchAuth.esc(ChurchAuth.safeUrl(downloadLink))}" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-sm px-3 fw-bold rounded-pill">
                        <i class="fa-solid fa-download me-1"></i> تحميل الشيت
                    </a>
                </div>
            `;
            container.appendChild(card);
        });
    }

    loadSubjects();
</script>
</body>
</html>
