<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باركود الحضور الشخصي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- مكتبة JsBarcode خفيفة وسريعة لرسم الباركود -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body class="bg-light" style="font-family: 'Tajawal', sans-serif;">

<div class="container py-5" style="max-width: 480px;">
    <div class="card shadow-sm border-0 rounded-4 p-4 text-center">
        <h5 class="fw-bold mb-1 text-primary">بطاقة الحضور الإلكتروني</h5>
        <p class="text-muted small mb-3" id="ui-level">الفرقة</p>

        <h4 class="fw-bold mb-0" id="ui-name">جاري التحميل...</h4>
        <div class="text-muted mb-3">كود الطالب: <strong id="ui-code">----</strong></div>

        <!-- الباركود المرئي -->
        <div class="py-3 bg-white border rounded-3 mb-3">
            <svg id="barcode"></svg>
        </div>

        <p class="small text-muted">قم بإبراز هذا الباركود لمسؤول الخدمة لتسجيل حضورك في المحاضرة.</p>
        <a href="index.html" class="btn btn-outline-secondary w-100">العودة للصفحة الرئيسية</a>
    </div>
</div>

<script src="auth-client.js"></script>
<script>
    const studentCode = localStorage.getItem('student_code');
    const studentName = localStorage.getItem('student_name');
    const studentLevel = localStorage.getItem('student_level');

    if (!studentCode) window.location.href = 'login.html';

    document.getElementById('ui-level').textContent = studentLevel || 'إعداد الخدام';
    document.getElementById('ui-name').textContent = studentName;
    document.getElementById('ui-code').textContent = studentCode;

    // رسم الباركود باستخدام الكود المحفوظ في المتصفح
    JsBarcode("#barcode", studentCode, {
        format: "CODE128",
        width: 2,
        height: 70,
        displayValue: true
    });
</script>
</body>
</html>
