<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حصادي وإنجازاتي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f4f7fb; }
        .stat-box { background: #fff; border-radius: 16px; padding: 20px; text-align: center; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.03); height: 100%; }
        .stat-box i { font-size: 2.5rem; margin-bottom: 12px; }
        .stat-box h3 { font-weight: 800; font-size: 2.2rem; margin: 0; color: #1e293b; }
        .stat-box p { color: #64748b; margin: 5px 0 0 0; font-size: 0.95rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container py-4" style="max-width: 800px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="index.html?v=4" class="btn btn-outline-secondary btn-sm fw-bold"><i class="fa-solid fa-arrow-right me-1"></i> العودة للرئيسية</a>
            <h4 class="fw-bold mb-0 text-primary">🌾 لوحة الحصاد والإنجازات</h4>
        </div>

        <div class="alert border-0 shadow-sm rounded-4 mb-4 text-center" style="background: linear-gradient(135deg, #eaf3ff, #f7faff); border: 1px solid #bcd8f7 !important;">
            <h4 class="fw-bold mb-2 text-primary" id="hName">جاري التحميل...</h4>
            <span class="badge bg-primary fs-6 px-3 py-2" id="hRole">...</span>
        </div>

        <div class="row g-3" id="studentStats" style="display:none;">
            <div class="col-6 col-md-3"><div class="stat-box"><i class="fa-solid fa-star text-warning"></i><h3 id="stPoints">0</h3><p>إجمالي النقاط</p></div></div>
            <div class="col-6 col-md-3"><div class="stat-box"><i class="fa-solid fa-book-bible text-primary"></i><h3 id="stBible">0</h3><p>أيام القراءة</p></div></div>
            <div class="col-6 col-md-3"><div class="stat-box"><i class="fa-solid fa-dove text-success"></i><h3 id="stNotes">0</h3><p>النوتة الروحية</p></div></div>
            <div class="col-6 col-md-3"><div class="stat-box"><i class="fa-solid fa-file-lines text-danger"></i><h3 id="stSheets">0</h3><p>الشيتات المنجزة</p></div></div>
        </div>

        <div class="row g-3" id="servantStats" style="display:none;">
            <div class="col-12 mb-2">
                <button class="btn btn-success w-100 fw-bold shadow-sm py-2" onclick="registerMyAttendance()">تسجيل حضوري للخدمة اليوم ✔️</button>
            </div>
            <div class="col-6 col-md-3"><div class="stat-box"><i class="fa-solid fa-calendar-check text-success"></i><h3 id="svAttend">0</h3><p>حضور الخدمة</p></div></div>
            <div class="col-6 col-md-3"><div class="stat-box"><i class="fa-solid fa-house-chimney-medical text-danger"></i><h3 id="svVisits">0</h3><p>الافتقادات</p></div></div>
            <div class="col-6 col-md-3"><div class="stat-box"><i class="fa-solid fa-list-check text-warning"></i><h3 id="svTasks">0</h3><p>التكليفات</p></div></div>
            <div class="col-6 col-md-3"><div class="stat-box"><i class="fa-solid fa-dove text-primary"></i><h3 id="svSpiritual">0</h3><p>أيام النوتة</p></div></div>
        </div>
    </div>

    <script src="auth-client.js"></script>
    <script>
        let currentS = null;
        ChurchAuth.ready.then(s => {
            if(!s) return window.location.replace('login.html');
            currentS = s;
            document.getElementById('hName').innerText = s.name;
            let isServant = (s.role === 'admin' || s.role === 'servant');
            document.getElementById('hRole').innerText = isServant ? 'سجل إنجازات الخادم' : 'سجل إنجازات الدارس';

            refreshStats();
        });

        function refreshStats() {
            let s = currentS;
            let isServant = (s.role === 'admin' || s.role === 'servant');
            let members = JSON.parse(localStorage.getItem('my_church_class')) || [];
            let servantsAtt = JSON.parse(localStorage.getItem('my_church_servants_attendance')) || {};
            let masterPlan = JSON.parse(localStorage.getItem('my_church_master_plan')) || [];
            let servants = JSON.parse(localStorage.getItem('my_church_servants')) || [];

            if(!isServant) {
                document.getElementById('studentStats').style.display = 'flex';
                let me = members.find(m => m.name === s.name || m.code === s.code) || {};
                document.getElementById('stPoints').innerText = me.points || 0;
                document.getElementById('stBible').innerText = me.readCount || 0;
                document.getElementById('stNotes').innerText = me.spiritualDays || 0;
                document.getElementById('stSheets').innerText = me.sheetsCount || 0;
            } else {
                document.getElementById('servantStats').style.display = 'flex';
                
                let attCount = 0;
                Object.values(servantsAtt).forEach(dayList => {
                    if(dayList.some(x => x.name === s.name || x.code === s.code)) attCount++;
                });

                let visCount = 0;
                members.forEach(m => {
                    if(m.visitations) visCount += m.visitations.filter(v => v.by === s.name || (s.role==='admin' && v.by==='admin')).length;
                });

                let taskCount = masterPlan.filter(p => p.responsible === s.name).length;
                let standaloneAdminNotes = JSON.parse(localStorage.getItem('admin_spiritual_notes') || '{}');
                let myServantFile = servants.find(x => x.name === s.name || x.code === s.code) || {};
                let spiritualDaysTotal = myServantFile.spiritualDays || standaloneAdminNotes['admin_points'] || 0;

                document.getElementById('svAttend').innerText = attCount;
                document.getElementById('svVisits').innerText = visCount;
                document.getElementById('svTasks').innerText = taskCount;
                document.getElementById('svSpiritual').innerText = spiritualDaysTotal;
            }
        }

        function registerMyAttendance() {
            if(!currentS) return;
            let today = new Date().toISOString().split('T')[0];
            let servantsAtt = JSON.parse(localStorage.getItem('my_church_servants_attendance')) || {};
            if(!servantsAtt[today]) servantsAtt[today] = [];
            
            let exists = servantsAtt[today].find(x => x.name === currentS.name);
            if(!exists) {
                servantsAtt[today].push({
                    id: currentS.id || Date.now(),
                    name: currentS.name,
                    code: currentS.code || 'admin',
                    time: new Date().toLocaleTimeString('ar-EG')
                });
                localStorage.setItem('my_church_servants_attendance', JSON.stringify(servantsAtt));
                refreshStats();
                alert("تم تسجيل حضورك للخدمة بنجاح!");
            } else {
                alert("حضورك مسجل بالفعل اليوم.");
            }
        }
    </script>
</body>
</html>
