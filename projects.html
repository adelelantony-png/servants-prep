<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المشروعات والأنشطة — خدمتي برو الذكي</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><style>body{font-family:Tajawal,sans-serif;background:#f5f8fc;color:#18324d}.wrap{max-width:1050px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#123b78,#1f6feb);color:#fff;border-radius:22px;padding:24px;box-shadow:0 12px 30px #123b7826}.cardx{background:#fff;border:1px solid #e3eaf3;border-radius:18px;padding:18px;box-shadow:0 5px 18px #123b7810;height:100%}.pill{display:inline-block;padding:5px 10px;border-radius:99px;background:#eef4ff;color:#1f5fbf;font-weight:700;font-size:12px}.btnx{border:0;border-radius:12px;padding:9px 14px;font-weight:800}.member{background:#ecfdf5;color:#087443}</style></head><body><div class="wrap"><div class="hero d-flex justify-content-between gap-3 flex-wrap align-items-center"><div><div class="pill bg-white text-primary">المشروع المدمج</div><h1 class="h3 fw-bold mt-2">🚀 المشروعات والأنشطة</h1><p class="mb-0 opacity-75">المشروع مرتبط مباشرة بالمخدوم، النقاط، الحضور والإنجازات.</p></div><a href="index.html" class="btn btn-light fw-bold">↩ العودة للبوابة</a></div><div class="row g-3 mt-2" id="projects"></div></div><script src="auth-client.js"></script>
<script>
const esc=ChurchAuth.esc;
const box=document.getElementById('projects');
let canJoin=false;
function render(list){
  if(!list.length){box.innerHTML='<div class="col-12"><div class="cardx text-center text-secondary">لا توجد مشروعات حاليًا.</div></div>';return}
  box.innerHTML=list.map(p=>`<div class="col-md-4"><div class="cardx"><div class="d-flex justify-content-between"><span class="pill">${esc(p.level==='الكل'?'عام للجميع':p.level)}</span><strong>${Number(p.points)||0} نقطة</strong></div><h2 class="h5 fw-bold mt-3">${esc(p.title)}</h2><p class="text-secondary small">${esc(p.description)}</p><div class="small mb-3">📅 ${esc(p.date)}</div>${canJoin?`<button class="btnx ${p.joined?'member':'btn-primary'} w-100" data-id="${esc(p.id)}">${p.joined?'✓ مشترك — إلغاء المشاركة':'+ تسجيل مشاركة'}</button>`:''}</div></div>`).join('');
}
async function load(){
  const r=await ChurchAuth.fetch('/api/projects');const j=await r.json();
  if(!j.success){box.innerHTML='<div class="col-12"><div class="alert alert-danger">'+esc(j.message||'تعذر التحميل')+'</div></div>';return}
  canJoin=!!j.studentCode;render(j.data);
}
box.addEventListener('click',async e=>{
  const b=e.target.closest('button[data-id]');if(!b)return;b.disabled=true;
  try{
    const r=await ChurchAuth.fetch('/api/projects',{method:'POST',body:JSON.stringify({action:'toggle',id:b.dataset.id})});const j=await r.json();
    if(!j.success)throw new Error(j.message||'فشل الطلب');
    localStorage.setItem('student_points',j.points);
    await load();
  }catch(er){alert(er.message);b.disabled=false}
});
ChurchAuth.ready.then(s=>{if(s)load().catch(()=>{box.innerHTML='<div class="col-12"><div class="alert alert-danger">تعذر تحميل المشروعات.</div></div>'})});
</script></body></html>
