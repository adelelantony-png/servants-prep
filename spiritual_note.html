<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النوتة الروحية الأرثوذكسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f4f7fb; color: #1e293b; }
        .card-custom { background: #fff; border-radius: 18px; padding: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 16px; border: 1px solid #e2e8f0; }
        .check-item { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px dashed #e2e8f0; }
        .check-item:last-child { border-bottom: none; }
        .form-check-input { width: 24px; height: 24px; cursor: pointer; border-color: #cbd5e1; }
        .form-check-input:checked { background-color: #0b4ca5; border-color: #0b4ca5; }
        .fasting-badge { font-size: 13px; font-weight: 800; padding: 8px 14px; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="container py-4" style="max-width: 650px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="index.html" class="btn btn-outline-secondary btn-sm fw-bold"><i class="fa-solid fa-arrow-right me-1"></i> العودة للرئيسية</a>
            <h4 class="fw-bold mb-0 text-primary">🕊️ النوتة الروحية الأرثوذكسية</h4>
        </div>

        <div class="card-custom text-center" style="background: linear-gradient(135deg, #eaf3ff, #f7faff); border-color:#bcd8f7;">
            <h4 class="fw-bold mb-1 text-primary" id="userName">جاري التحميل...</h4>
            <div class="text-muted small fw-bold mb-2">تاريخ اليوم: <span id="todayDateStr"></span></div>
            <div id="fastingInfoBadge" class="d-inline-block fasting-badge bg-light text-secondary border">جاري فحص الطقس الكنسي...</div>
        </div>

        <div class="card-custom">
            <h5 class="fw-bold text-primary mb-3"><i class="fa-solid fa-hands-praying me-2 text-warning"></i> صلوات الأجبية والمزامير</h5>
            <div class="check-item"><label class="fw-bold">صلاة باكر</label><input type="checkbox" class="form-check-input" id="chkAgpeyaBaker"></div>
            <div class="check-item"><label class="fw-bold">صلاة الغروب</label><input type="checkbox" class="form-check-input" id="chkAgpeyaGhoroub"></div>
            <div class="check-item"><label class="fw-bold">صلاة النوم</label><input type="checkbox" class="form-check-input" id="chkAgpeyaNoum"></div>
            <div class="check-item"><label class="fw-bold">صلوات أخرى (السواعي / صلاة يسوع)</label><input type="checkbox" class="form-check-input" id="chkOtherPrayers"></div>
        </div>

        <div class="card-custom">
            <h5 class="fw-bold text-success mb-3"><i class="fa-solid fa-book-bible me-2"></i> كلمة الله والمطالعة</h5>
            <div class="check-item">
                <div>
                    <label class="fw-bold d-block mb-0">قراءة إصحاح الكتاب المقدس</label>
                    <small class="text-muted">تُفعل تلقائياً من صفحة الكتاب المقدس</small>
                </div>
                <input type="checkbox" class="form-check-input" id="chkBible" disabled style="opacity:0.8;">
            </div>
            <div class="check-item"><label class="fw-bold">قراءة روحية / سنكسار / قطمارس</label><input type="checkbox" class="form-check-input" id="chkSpiritualReading"></div>
        </div>

        <div class="card-custom">
            <h5 class="fw-bold text-danger mb-3"><i class="fa-solid fa-church me-2"></i> الأصوام والأسرار الكنسية</h5>
            <div class="check-item" id="fastingCheckRow">
                <div>
                    <label class="fw-bold d-block mb-1" id="fastingLabelTitle">صوم اليوم (الأربعاء / الجمعة / صوام كنسية)</label>
                    <small class="text-muted" id="fastingNoteDesc">بحسب طقس الكنيسة اليوم</small>
                </div>
                <input type="checkbox" class="form-check-input" id="chkFasting">
            </div>
            <div class="check-item"><label class="fw-bold">حضور القداس الإلهي / التناول 🕊️</label><input type="checkbox" class="form-check-input" id="chkCommunion"></div>
            <div class="check-item"><label class="fw-bold">عمل محبة ورحمة / افتقاد</label><input type="checkbox" class="form-check-input" id="chkMercy"></div>
        </div>

        <button class="btn btn-primary w-100 py-3 fw-bold fs-5 shadow-sm rounded-3" id="btnSaveSpiritual" onclick="saveSpiritualNote()">
            حفظ النوتة الروحية لليوم ✔️
        </button>
    </div>

    <script src="auth-client.js"></script>
    <script>
        let currentUser = null;
        let isServant = false;
        let todayKey = new Date().toISOString().split('T')[0];

        document.getElementById('todayDateStr').innerText = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        function getOrthodoxEaster(year) {
            const a = year % 4, b = year % 7, c = year % 19;
            const d = (19 * c + 15) % 30;
            const e = (2 * a + 4 * b - d + 34) % 7;
            const month = Math.floor((d + e + 114) / 31);
            const day = ((d + e + 114) % 31) + 1;
            let easter = new Date(year, month - 1, day);
            easter.setDate(easter.getDate() + 13);
            return easter;
        }

        function evaluateCopticFast(date) {
            const year = date.getFullYear(), month = date.getMonth() + 1, day = date.getDate(), dayOfWeek = date.getDay();
            const easter = getOrthodoxEaster(year);
            const pentecost = new Date(easter);
            pentecost.setDate(pentecost.getDate() + 49);

            if (date >= easter && date <= pentecost) return { isFasting: false, isFifty: true, title: "فترة الخماسين المقدسة ✨", desc: "أيام قيامة وفرح: لا صيام أربعاء أو جمعة." };
            if ((month === 11 && day >= 25) || month === 12 || (month === 1 && day <= 6)) return { isFasting: true, isFifty: false, title: "صوم الميلاد المجيد 🌟", desc: "صوم كنسي مبارك حتى 7 يناير." };
            if (month === 8 && day >= 7 && day <= 21) return { isFasting: true, isFifty: false, title: "صوم السيدة العذراء مريم 🌹", desc: "صوم مبارك حتى 22 أغسطس." };
            if (dayOfWeek === 3) return { isFasting: true, isFifty: false, title: "صوم يوم الأربعاء ✝️", desc: "تذكار التشاور على تسليم المخلص." };
            if (dayOfWeek === 5) return { isFasting: true, isFifty: false, title: "صوم يوم الجمعة ✝️", desc: "تذكار الصلب والفداء المجيد." };

            return { isFasting: false, isFifty: false, title: "يوم فطر كنسي 🌿", desc: "لا يوجد صوم كنسي إلزامي اليوم." };
        }

        const fastStatus = evaluateCopticFast(new Date());
        const badge = document.getElementById('fastingInfoBadge');
        const fastRow = document.getElementById('fastingCheckRow');
        const fastLabel = document.getElementById('fastingLabelTitle');
        const fastDesc = document.getElementById('fastingNoteDesc');

        badge.innerText = fastStatus.title;
        if (fastStatus.isFifty) {
            badge.className = "d-inline-block fasting-badge bg-warning text-dark border border-warning";
            fastRow.style.opacity = "0.6";
            fastLabel.innerHTML = `<i class="fa-solid fa-dove text-warning me-2"></i> فرح الخماسين المقدسة`;
            fastDesc.innerText = "لا يوجد صيام في فترة الخماسين";
            document.getElementById('chkFasting').disabled = true;
        } else if (fastStatus.isFasting) {
            badge.className = "d-inline-block fasting-badge bg-danger text-white";
            fastLabel.innerHTML = `<i class="fa-solid fa-utensils text-danger me-2"></i> ${fastStatus.title}`;
            fastDesc.innerText = fastStatus.desc;
        } else {
            badge.className = "d-inline-block fasting-badge bg-success text-white";
            fastLabel.innerHTML = `<i class="fa-solid fa-leaf text-success me-2"></i> صوم اختياري / تدريب خاص`;
            fastDesc.innerText = fastStatus.desc;
        }

        ChurchAuth.ready.then(s => {
            if(!s) return location.replace('login.html');
            currentUser = s;
            isServant = (s.role === 'admin' || s.role === 'servant');
            document.getElementById('userName').innerText = s.name + (isServant ? ' (خادم)' : ' (دارس)');
            
            let bibleLogs = JSON.parse(localStorage.getItem('church_bible_reads') || '{}');
            if (bibleLogs[todayKey]) document.getElementById('chkBible').checked = true;
        });

        function saveSpiritualNote() {
            if(!currentUser) return;
            const btn = document.getElementById('btnSaveSpiritual');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> جاري الحفظ...';

            if(!isServant) {
                let members = JSON.parse(localStorage.getItem('my_church_class')) || [];
                let idx = members.findIndex(m => m.id.toString() === currentUser.id.toString() || m.code === currentUser.code);
                if(idx > -1) {
                    members[idx].spiritualDays = (members[idx].spiritualDays || 0) + 1;
                    members[idx].points = (parseInt(members[idx].points) || 0) + 5;
                    localStorage.setItem('my_church_class', JSON.stringify(members));
                }
            } else {
                let servants = JSON.parse(localStorage.getItem('my_church_servants')) || [];
                let idx = servants.findIndex(x => x.id.toString() === currentUser.id.toString() || x.code === currentUser.code);
                if(idx > -1) {
                    servants[idx].spiritualDays = (servants[idx].spiritualDays || 0) + 1;
                    localStorage.setItem('my_church_servants', JSON.stringify(servants));
                }
            }

            setTimeout(() => {
                btn.className = 'btn btn-success w-100 py-3 fw-bold fs-5 shadow-sm rounded-3';
                btn.innerHTML = '<i class="fa-solid fa-check-double me-1"></i> تم حفظ نوتتك الروحية بنجاح!';
            }, 400);
        }
    </script>
</body>
    </html>
