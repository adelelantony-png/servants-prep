<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القراءات الكنسية اليومية (القطمارس)</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; color: #2d3748; }
        .main-card { max-width: 780px; margin: 20px auto; background: #ffffff; border-radius: 18px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        .reading-section { border-right: 4px solid #1e3c72; padding: 16px; background-color: #f8fafc; border-radius: 10px; margin-bottom: 20px; }
        .reading-title { font-weight: 700; color: #1e3c72; font-size: 1.15rem; }
        .verse-text { line-height: 2.3; font-size: 1.15rem; color: #334155; margin-top: 10px; text-align: justify; }
        .reference-badge { font-size: 0.85rem; background: #e0e7ff; color: #1e3c72; border-radius: 6px; padding: 4px 10px; font-weight: 700; }
    </style>
</head>
<body>

<div class="container pb-5">
    <div class="main-card">
        <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-3">
            <a href="index.html" class="btn btn-outline-secondary btn-sm fw-bold"><i class="fa-solid fa-arrow-right me-1"></i> الرئيسية</a>
            <h4 class="fw-bold mb-0 text-primary"><i class="fa-solid fa-book-bible me-2"></i>القطمارس اليومي</h4>
            <span id="currentDateBadge" class="badge bg-primary fs-6"></span>
        </div>

        <!-- عشية وباكر -->
        <div class="row g-2 mb-3">
            <div class="col-md-6">
                <div class="p-3 bg-light rounded-3 border">
                    <h6 class="fw-bold text-secondary mb-1">مزمور العشية</h6>
                    <p id="vespersText" class="small mb-0 text-muted"></p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="p-3 bg-light rounded-3 border">
                    <h6 class="fw-bold text-secondary mb-1">مزمور باكر</h6>
                    <p id="matinsText" class="small mb-0 text-muted"></p>
                </div>
            </div>
        </div>

        <h5 class="fw-bold text-primary mt-4 mb-3 border-bottom pb-2">قداس المؤمنين</h5>

        <div class="reading-section">
            <div class="d-flex justify-content-between align-items-center">
                <span class="reading-title"><i class="fa-solid fa-cross me-1"></i> البولس</span>
                <span id="paulineRef" class="reference-badge"></span>
            </div>
            <div id="paulineText" class="verse-text"></div>
        </div>

        <div class="reading-section">
            <div class="d-flex justify-content-between align-items-center">
                <span class="reading-title"><i class="fa-solid fa-church me-1"></i> الكاثوليكون</span>
                <span id="catholicRef" class="reference-badge"></span>
            </div>
            <div id="catholicText" class="verse-text"></div>
        </div>

        <div class="reading-section">
            <div class="d-flex justify-content-between align-items-center">
                <span class="reading-title"><i class="fa-solid fa-scroll me-1"></i> الإبركسيس</span>
                <span id="praxisRef" class="reference-badge"></span>
            </div>
            <div id="praxisText" class="verse-text"></div>
        </div>

        <div class="reading-section" style="border-right-color: #198754; background-color: #f0fdf4;">
            <div class="d-flex justify-content-between align-items-center">
                <span class="reading-title text-success"><i class="fa-solid fa-book-open me-1"></i> إنجيل القداس الإلهي</span>
                <span id="gospelRef" class="reference-badge bg-success text-white"></span>
            </div>
            <div id="gospelText" class="verse-text"></div>
        </div>

    </div>
</div>

<script src="auth-client.js"></script>
<script>
    // حماية الصفحة والتأكد من تسجيل الدخول
    if (!localStorage.getItem('student_code')) window.location.href = 'login.html';

    // طباعة تاريخ اليوم
    document.getElementById('currentDateBadge').textContent = new Date().toISOString().split('T')[0];

    // قاعدة بيانات القطمارس المصغرة (يمكن تطويرها لاحقاً لتجلب من ملف JSON خارجي)
    const readingsDB = {
        "default": {
            "vespers": "«مُبَارَكٌ الرَّبُّ يَوْمًا فَيَوْمًا. يُحَمِّلُنَا إِلهُ خَلاَصِنَا...» (مز 68: 19)",
            "matins": "«يَا اللهُ، إِلهِي أَنْتَ. إِلَيْكَ أُبَكِّرُ. عَطِشَتْ إِلَيْكَ نَفْسِي...» (مز 63: 1)",
            "pauline": { "ref": "العبرانيين 4: 14 - 5: 6", "text": "«فَبِمَا أَنَّ لَنَا رَئِيسَ كَهَنَةٍ عَظِيمٌ قَدِ اجْتَازَ السَّمَاوَاتِ، يَسُوعُ ابْنُ اللهِ...»" },
            "catholic": { "ref": "يعقوب 1: 1 - 12", "text": "«يَا إِخْوَتِي، احْسِبُوهُ كُلَّ فَرَحٍ حِينَمَا تَقَعُونَ فِي تَجَارِبَ مُتَنَوِّعَةٍ...»" },
            "praxis": { "ref": "أعمال الرسل 13: 25 - 33", "text": "«وَلَمَّا صَارَ يُوحَنَّا يُكَمِّلُ سَعْيَهُ كَانَ يَقُولُ: مَنْ تَظُنُّونَ أَنِّي أَنَا؟...»" },
            "gospel": { "ref": "متى 11: 25 - 30", "text": "«فِي ذلِكَ الْوَقْتِ أَجَابَ يَسُوعُ وَقَالَ: أَحْمَدُكَ أَيُّهَا الآبُ رَبُّ السَّمَاءِ وَالأَرْضِ...»" }
        }
    };

    // حقن القراءات في الواجهة
    const cur = readingsDB["default"];
    document.getElementById('vespersText').textContent = cur.vespers;
    document.getElementById('matinsText').textContent = cur.matins;
    document.getElementById('paulineRef').textContent = cur.pauline.ref;
    document.getElementById('paulineText').textContent = cur.pauline.text;
    document.getElementById('catholicRef').textContent = cur.catholic.ref;
    document.getElementById('catholicText').textContent = cur.catholic.text;
    document.getElementById('praxisRef').textContent = cur.praxis.ref;
    document.getElementById('praxisText').textContent = cur.praxis.text;
    document.getElementById('gospelRef').textContent = cur.gospel.ref;
    document.getElementById('gospelText').textContent = cur.gospel.text;
</script>
</body>
</html>
